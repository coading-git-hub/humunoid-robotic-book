<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Robot Head -->
  <rect x="12" y="8" width="16" height="12" rx="2" fill="#25c2a0" stroke="#1a8a6b" stroke-width="1"/>
  <!-- Eyes -->
  <circle cx="16" cy="12" r="2" fill="#ffffff"/>
  <circle cx="24" cy="12" r="2" fill="#ffffff"/>
  <circle cx="16" cy="12" r="1" fill="#25c2a0"/>
  <circle cx="24" cy="12" r="1" fill="#25c2a0"/>
  <!-- Mouth -->
  <rect x="18" y="16" width="4" height="2" rx="1" fill="#ffffff"/>
  <!-- Antennas -->
  <line x1="16" y1="8" x2="14" y2="4" stroke="#25c2a0" stroke-width="2" stroke-linecap="round"/>
  <line x1="24" y1="8" x2="26" y2="4" stroke="#25c2a0" stroke-width="2" stroke-linecap="round"/>
  <circle cx="14" cy="4" r="1.5" fill="#25c2a0"/>
  <circle cx="26" cy="4" r="1.5" fill="#25c2a0"/>
  <!-- Body -->
  <rect x="14" y="20" width="12" height="16" rx="2" fill="#25c2a0" stroke="#1a8a6b" stroke-width="1"/>
  <!-- Arms -->
  <rect x="8" y="22" width="6" height="3" rx="1.5" fill="#25c2a0" stroke="#1a8a6b" stroke-width="1"/>
  <rect x="26" y="22" width="6" height="3" rx="1.5" fill="#25c2a0" stroke-width="1"/>
  <!-- Legs -->
  <rect x="16" y="36" width="3" height="4" rx="1.5" fill="#25c2a0" stroke="#1a8a6b" stroke-width="1"/>
  <rect x="21" y="36" width="3" height="4" rx="1.5" fill="#25c2a0" stroke="#1a8a6b" stroke-width="1"/>
</svg>