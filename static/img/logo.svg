<svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#25c2a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a8a6b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Simplified robot head icon -->
  <rect x="8" y="8" width="24" height="24" rx="4" fill="url(#logoGradient)" stroke="#ffffff" stroke-width="1.5"/>
  
  <!-- Eyes -->
  <circle cx="16" cy="18" r="2.5" fill="#ffffff"/>
  <circle cx="24" cy="18" r="2.5" fill="#ffffff"/>
  
  <!-- Circuit line -->
  <line x1="12" y1="26" x2="28" y2="26" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- AI symbol -->
  <path d="M 20 10 L 22 14 L 18 14 Z" fill="#ffffff" opacity="0.9"/>
</svg>
