<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f3e5f5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="robotGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#25c2a0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a8a6b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="url(#bgGradient)"/>

  <!-- Robot Body -->
  <rect x="150" y="120" width="100" height="120" rx="10" fill="url(#robotGradient)" stroke="#1a8a6b" stroke-width="2"/>

  <!-- Robot Head -->
  <rect x="165" y="60" width="70" height="60" rx="8" fill="url(#robotGradient)" stroke="#1a8a6b" stroke-width="2"/>

  <!-- Eyes -->
  <circle cx="185" cy="85" r="8" fill="#ffffff" stroke="#1a8a6b" stroke-width="1"/>
  <circle cx="215" cy="85" r="8" fill="#ffffff" stroke="#1a8a6b" stroke-width="1"/>
  <circle cx="185" cy="85" r="4" fill="#25c2a0"/>
  <circle cx="215" cy="85" r="4" fill="#25c2a0"/>

  <!-- Mouth -->
  <rect x="195" y="100" width="10" height="4" rx="2" fill="#ffffff"/>

  <!-- Antennas -->
  <line x1="185" y1="60" x2="175" y2="40" stroke="#25c2a0" stroke-width="3" stroke-linecap="round"/>
  <line x1="215" y1="60" x2="225" y2="40" stroke="#25c2a0" stroke-width="3" stroke-linecap="round"/>
  <circle cx="175" cy="40" r="4" fill="#25c2a0"/>
  <circle cx="225" cy="40" r="4" fill="#25c2a0"/>

  <!-- Arms -->
  <rect x="120" y="140" width="30" height="8" rx="4" fill="url(#robotGradient)" stroke="#1a8a6b" stroke-width="1"/>
  <rect x="250" y="140" width="30" height="8" rx="4" fill="url(#robotGradient)" stroke="#1a8a6b" stroke-width="1"/>

  <!-- Hands -->
  <circle cx="110" cy="144" r="8" fill="url(#robotGradient)" stroke="#1a8a6b" stroke-width="1"/>
  <circle cx="290" cy="144" r="8" fill="url(#robotGradient)" stroke="#1a8a6b" stroke-width="1"/>

  <!-- Legs -->
  <rect x="170" y="240" width="15" height="40" rx="7.5" fill="url(#robotGradient)" stroke="#1a8a6b" stroke-width="1"/>
  <rect x="215" y="240" width="15" height="40" rx="7.5" fill="url(#robotGradient)" stroke="#1a8a6b" stroke-width="1"/>

  <!-- Feet -->
  <ellipse cx="177.5" cy="285" rx="12" ry="8" fill="url(#robotGradient)" stroke="#1a8a6b" stroke-width="1"/>
  <ellipse cx="222.5" cy="285" rx="12" ry="8" fill="url(#robotGradient)" stroke="#1a8a6b" stroke-width="1"/>

  <!-- Control Panel on Body -->
  <rect x="170" y="140" width="60" height="30" rx="5" fill="#ffffff" opacity="0.9"/>
  <circle cx="185" cy="155" r="3" fill="#25c2a0"/>
  <circle cx="200" cy="155" r="3" fill="#25c2a0"/>
  <circle cx="215" cy="155" r="3" fill="#25c2a0"/>
  <rect x="180" y="165" width="40" height="2" rx="1" fill="#25c2a0"/>

  <!-- Floating elements -->
  <circle cx="100" cy="80" r="3" fill="#25c2a0" opacity="0.6"/>
  <circle cx="300" cy="120" r="2" fill="#25c2a0" opacity="0.4"/>
  <circle cx="320" cy="60" r="4" fill="#25c2a0" opacity="0.3"/>
  <circle cx="80" cy="150" r="2.5" fill="#25c2a0" opacity="0.5"/>
</svg>